<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos Twin Ovens</title>
    <script src="05_atributos_mp_torres_jorge.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f7efe3;
            color: #422817;
            padding: 2rem;
        }

        #producto {
            font-size: 5rem;
            margin: 1rem;
        }

        .horno-activo {
            color: #a64b1a;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Twin Ovens en Quito Ecuador</h1>
    <p>Guaguas de pan y varios panes recien horneados</p>

    <div id="producto" role="img" aria-label="Guaguas de pan"
         title="Guaguas de pan" data-producto="guaguas">🥐</div>
    <p id="descripcion">Guaguas de pan de Twin Ovens Quito</p>
    <button id="cambiar" type="button">Cambiar producto</button>
    <button id="verProducto" type="button">Ver producto</button>

    <h2>Cambiar el estado del horno</h2>
    <div id="horno">Horno apagado</div>
    <button id="activarHorno" type="button">Activar horno</button>
</body>
</html>
