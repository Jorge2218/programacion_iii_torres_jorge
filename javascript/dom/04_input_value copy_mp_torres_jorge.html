<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Twin Ovens</title>
    <script src="04_input_value_mp_torres_jorge.js" defer></script>
</head>
<body>
    <h1>Calcular pedidos de Twin Ovens</h1>
    <p>Panaderia de Quito Ecuador con guaguas y panes</p>

    <label for="cantidad">Cantidad de pedidos</label>
    <input id="cantidad" type="number" min="1" step="1" placeholder="Cantidad de pedidos">

    <label for="panesPorPedido">Panes por pedido</label>
    <input id="panesPorPedido" type="number" min="1" step="1" placeholder="Panes por pedido">

    <button id="calcular" type="button">Calcular total</button>
    <h2 id="resultado">Ingresa las cantidades</h2>
</body>
</html>
