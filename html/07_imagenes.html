<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imagenes</title>
</head>
<body>
    <h1>Utilización de la etiqueta img</h1>

    <img src="images/gato.jpg" alt="Gato"
    width="300"
    height="300"
    loading="lazy">

    <img src="https://urgenciesveterinaries.com/wp-content/uploads/2023/09/survet-gato-caida-pelo-01.jpeg" alt="Gato"
    width="300"
    height="300"
    loading="lazy">
    
    <img src="images/personajes/familia.jpeg" alt="Gato"
    width="300"
    height="300"
    loading="lazy">

    <figure>
        <img 
        src="../images/gatopareja.jpeg" alt="Gato"
        width="300"
        height="300"
        loading="lazy">
        <figcaption>
            Gato 
        </figcaption>
    </figure>
    <a href="https://es.wikipedia.org/wiki/Felis_catus"
        target="_blank"
        >
        <img src="images/gato.jpg" 
            alt="Gato"
            width="300"
        >
    </a>

</body>
</html>
