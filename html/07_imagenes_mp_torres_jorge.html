<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imagenes</title>
</head>
<body>
    <h1>Utilización de la etiqueta img</h1>

    <img src="images/guagua.jpg" alt="Guagua de pan"
    width="300"
    height="300"
    loading="lazy">

    <img src="https://www.laylita.com/recipes/wp-content/uploads/2011/11/Recipe-for-Ecuadorian-guaguas-de-pan-or-bread-figures.jpg" alt="Guaguas de pan"
    width="300"
    height="300"
    loading="lazy">

    <img src="images/personajes/panaderos.jpg" alt="Equipo de Twin Ovens"
    width="300"
    height="300"
    loading="lazy">

    <figure>
        <img
        src="../images/guaguas_pareja.jpeg" alt="Guaguas gemelas"
        width="300"
        height="300"
        loading="lazy">
        <figcaption>
            Guaguas gemelas de Twin Ovens
        </figcaption>
    </figure>

    <a href="https://www.laylita.com/recipes/guaguas-de-pan-recipe/"
        target="_blank"
        >
        <img src="../images/guagua.jpg"
            alt="Receta de guaguas de pan"
            width="300"
        >
    </a>

</body>
</html>
