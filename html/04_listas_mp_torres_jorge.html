<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Listas</h1>
    <h1>Autor:Jorge Torres</h1>
    <h2>Panaderia</h2>
    <h1>Lista ordenada</h1>
    <!-- lista de elementos con orden especifico ordered list-->
    <ol>
        <li>guagua de pan</li>
        <li>pan de ambato</li>
        <li>pan de chocolate</li>
        <li>pastel</li>
    </ol>
    <!-- lista de elementos sin orden especifico unordered list-->
    <h1>Lista desordenada</h1>
    <ul>
        <li>guagua de pan</li>
        <li>pan de ambato</li>
        <li>pan de chocolate</li>
        <li>pastel</li>
    </ul>
</body>
</html>
