<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colores</title>
    <style>
        body{
            background-color: #fff8e7;
        }
        h1{
            color: chocolate;
        }
        h2{
            color: #D2691E;
        }
        h3{
            color: rgb(210, 105, 30);
        }
        h4{
            color: rgba(210, 105, 30, 0.5);
        }
        h5{
            color: hsl(25, 75%, 47%);
        }
    </style>
</head>
<body>
    <h1>Maneras de establecer colores</h1>
    <h1>Por nombre del color</h1>
    <h2>Hexadecimal</h2>
    <h3>RGB</h3>
    <h4>RGBA</h4>
    <h5>HSL</h5>
</body>
</html>
