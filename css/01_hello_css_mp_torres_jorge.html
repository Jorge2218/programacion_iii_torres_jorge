<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello_css</title>
    <style>
        h2{
            color:saddlebrown;
        }
        p{
            color:darkgreen;
        }
    </style>
    <link rel="stylesheet" href="01_hello_css.css">
</head>
<body>
    <h1>Maneras de incluir estilos CSS en un archivo HTML</h1>
    <h1 style="color:goldenrod">Twin Ovens con CSS tipo inline</h1>
    <h2>Estilos CSS - interno</h2>
    <p>Esta es la manera de incluir estilos de tipo interno, colocándolos en el head del HTML.</p>
    <h3>Estilos CSS - externo</h3>
    <a>Se incluyó el estilo a través de un archivo externo.</a>
</body>
</html>
